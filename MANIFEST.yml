description: |-
  Tune a receiver by what the decoder says (MER, CNR, SNR, BER), not by signal power.
  A pure-Python core (no GNU Radio dependency) searches runtime-discovered SoapySDR
  knobs against any scalar quality dial, classifies the failure from the SHAPE of the
  dial-vs-gain curve, refuses to recommend a setting without proof of decoded content,
  and says so in dB when the limit is physical. GNU Radio blocks on top: a headless
  controller speaking the command dialects gr-soapy and gr-uhd really accept, dial
  probes and adapters, a message-to-setter shim, and an optional Qt dashboard.
file_format: 1
